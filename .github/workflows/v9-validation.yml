name: V9 validation

on:
  push:
    branches: [feature/relief-pendant-v1]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install "numpy>=1.26.0" "pillow>=10.0.0" "trimesh>=4.0.0" "streamlit>=1.40.0"
      - name: Compile
        run: python -m py_compile app.py memorial_coin_v3.py relief_generator.py
      - name: Core V1-V9 regression
        run: |
          python - <<'PY'
          import io, math
          import numpy as np
          from PIL import Image, ImageDraw

          from relief_generator import ReliefConfig, make_depth_map, generate_relief_stl, inspect_stl
          from memorial_coin_v3 import (
              MemorialCoinConfig, V9_METAL_STYLES,
              make_memorial_coin_depth, generate_memorial_coin_stl,
              inspect_memorial_coin, validate_v9_production,
              build_v7_portrait_layers, build_v8_sculpt_channels,
              build_v9_artistic_channels,
          )

          size = 320
          img = Image.new("RGB", (size, size), "white")
          d = ImageDraw.Draw(img)
          d.ellipse((75, 45, 245, 245), fill=(180, 180, 180))
          d.ellipse((110, 110, 135, 140), fill=(40, 40, 40))
          d.ellipse((185, 110, 210, 140), fill=(40, 40, 40))
          d.polygon([(160,130),(145,190),(175,190)], fill=(100,100,100))
          d.ellipse((125,195,195,225), fill=(60,60,60))
          d.rectangle((95,245,225,315), fill=(120,120,120))
          buf=io.BytesIO(); img.save(buf,format="PNG"); data=buf.getvalue()

          rcfg=ReliefConfig(resolution=160, width_mm=30, height_mm=30, base_thickness_mm=2.0, relief_height_mm=0.9)
          depth=make_depth_map(data,160,mode="Grayscale")
          assert depth.shape==(160,160) and np.isfinite(depth).all() and depth.max()>depth.min()
          stl=generate_relief_stl(data,rcfg)
          info=inspect_stl(stl)
          assert info["watertight"] and info["volume_mm3"]>0

          cfg=MemorialCoinConfig(
              relief=ReliefConfig(
                  resolution=160,width_mm=30,height_mm=30,
                  base_thickness_mm=2.0,relief_height_mm=0.9,
                  hole_diameter_mm=3.0,hole_offset_mm=4.0,
                  shape="Circle",depth_model="Grayscale",relief_mode="Photo"
              )
          )
          portrait=make_memorial_coin_depth(data,cfg)
          assert portrait.shape==(160,160) and np.isfinite(portrait).all()
          assert float(portrait.max())>0 and float(portrait.min())>=0

          v7=build_v7_portrait_layers(Image.open(io.BytesIO(data)),160)
          assert set(v7)=={"face_structure","facial_features","hair_silhouette","clothing_silhouette","background_suppression"}
          assert all(np.isfinite(x).all() for x in v7.values())

          v8=build_v8_sculpt_channels(Image.open(io.BytesIO(data)),160)
          assert set(v8)=={"face_contour","eye_sockets","nose_bridge","lips","chin"}
          assert all(np.isfinite(x).all() for x in v8.values())

          for style in V9_METAL_STYLES:
              cfg.metal_style=style
              cfg.relief_art_strength=0.68
              cfg.tone_compression=0.62
              cfg.edge_crest_strength=0.42
              cfg.highlight_sculpt_strength=0.38
              cfg.relief_depth_curve=0.92
              cfg.micro_detail_suppression=0.35
              depth_v9=make_memorial_coin_depth(data,cfg)
              channels=build_v9_artistic_channels(depth_v9,Image.open(io.BytesIO(data)),cfg)
              assert all(np.isfinite(x).all() for x in channels.values())
              assert all(float(x.min())>=0 and float(x.max())<=1 for x in channels.values())
              assert float(depth_v9.max())>0
              report=validate_v9_production(cfg,Image.open(io.BytesIO(data)),None,None)
              assert report["version"]=="V9" and report["production_ready"] is True

          stl9=generate_memorial_coin_stl(data,cfg)
          info9=inspect_memorial_coin(stl9)
          assert info9["watertight"] and info9["volume_mm3"]>0
          assert info9["size_x_mm"] <= 30.5 and info9["size_y_mm"] <= 30.5
          print("V1-V9 CORE TEST PASS", info9)
          PY
