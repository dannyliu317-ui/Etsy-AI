name: V9.1 runtime test

on:
  push:
    branches: ["feature/relief-pendant-v1"]

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: pip install -r requirements.txt opencv-python-headless
      - name: Compile
        run: python -m py_compile app.py memorial_coin_v3.py relief_generator.py
      - name: V9.1 smoke test
        run: |
          python - <<'PY'
          import io
          import numpy as np
          from PIL import Image
          from memorial_coin_v3 import MemorialCoinConfig, make_memorial_coin_depth, generate_memorial_coin_stl, inspect_memorial_coin, validate_v91_production, build_v91_refinement_channels
          from relief_generator import ReliefConfig
          img=Image.new("RGB",(640,640),"white")
          px=np.asarray(img).copy(); yy,xx=np.mgrid[0:640,0:640]
          face=((xx-320)/170)**2+((yy-285)/215)**2<1
          hair=((xx-320)/205)**2+((yy-245)/230)**2<1
          shirt=((xx-320)/285)**2+((yy-590)/230)**2<1
          px[face]=[185,135,105]; px[hair]=[90,90,90]; px[shirt]=[210,215,220]; img=Image.fromarray(px)
          b=io.BytesIO(); img.save(b,"PNG"); data=b.getvalue()
          cfg=MemorialCoinConfig(relief=ReliefConfig(width_mm=30,height_mm=30,base_thickness_mm=2.3,relief_height_mm=1.1,hole_diameter_mm=3.0,resolution=160,shape="Circle",depth_model="Grayscale"))
          d=make_memorial_coin_depth(data,cfg)
          assert d.shape==(160,160) and np.isfinite(d).all()
          ch=build_v91_refinement_channels(d,img,cfg)
          assert set(ch)=={"face_plane","eyeglass_protection","nose_lip_separation","hair_strand_preservation","background_zero"}
          rep=validate_v91_production(cfg,img); assert rep["version"]=="V9.1"
          stl=generate_memorial_coin_stl(data,cfg); ins=inspect_memorial_coin(stl)
          assert ins["watertight"] and float(ins["volume_mm3"])>0
          print("V9.1 runtime smoke test: PASS", ins["volume_mm3"])
          PY
