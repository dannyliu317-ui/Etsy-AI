name: V9.1 runtime test

on:
  push:
    branches: ["feature/relief-pendant-v1"]

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: pip install -r requirements.txt opencv-python-headless
      - name: Compile
        run: python -m py_compile app.py memorial_coin_v3.py relief_generator.py
      - name: V9.1 smoke test
        run: |
          python - <<'PY'
          import io
          import numpy as np
          from PIL import Image
          from memorial_coin_v3 import (
              MemorialCoinConfig, V9_METAL_STYLES,
              make_memorial_coin_depth, generate_memorial_coin_stl,
              inspect_memorial_coin, validate_v91_production,
              build_v91_refinement_channels,
          )
          from relief_generator import ReliefConfig

          img = Image.new("RGB", (640, 640), "white")
          # Simple portrait-like composition for no-crash and mask testing.
          px = np.asarray(img).copy()
          yy, xx = np.mgrid[0:640, 0:640]
          face = ((xx-320)/170)**2 + ((yy-285)/215)**2 < 1
          hair = ((xx-320)/205)**2 + ((yy-245)/230)**2 < 1
          shirt = ((xx-320)/285)**2 + ((yy-590)/230)**2 < 1
          px[face] = [185, 135, 105]
          px[hair] = [90, 90, 90]
          px[shirt] = [210, 215, 220]
          img = Image.fromarray(px)
          buf=io.BytesIO(); img.save(buf, format="PNG"); data=buf.getvalue()

          cfg=MemorialCoinConfig(
              relief=ReliefConfig(
                  width_mm=30, height_mm=30, base_thickness_mm=2.3,
                  relief_height_mm=1.1, hole_diameter_mm=3.0,
                  resolution=160, shape="Circle", depth_model="Grayscale"
              ),
              metal_style="Sterling Silver",
              face_plane_compression=0.58,
              eyeglass_protection=0.85,
              nose_lip_separation=0.68,
              hair_strand_preservation=0.62,
              background_zero_strength=0.92,
              portrait_micro_detail=0.38,
          )
          depth=make_memorial_coin_depth(data,cfg)
          assert depth.shape==(160,160)
          assert np.isfinite(depth).all()
          channels=build_v91_refinement_channels(depth,img,cfg)
          assert set(channels)=={"face_plane","eyeglass_protection","nose_lip_separation","hair_strand_preservation","background_zero"}
          report=validate_v91_production(cfg,img)
          assert report["version"]=="V9.1"
          assert report["status"] in {"PASS","NEEDS REVIEW"}
          stl=generate_memorial_coin_stl(data,cfg)
          insp=inspect_memorial_coin(stl)
          assert insp["watertight"]
          assert float(insp["volume_mm3"])>0
          print("V9.1 runtime smoke test: PASS")
          print("STL:", len(stl), "bytes", "volume:", insp["volume_mm3"])
          print("Report:", report["status"], "warnings:", report["warning_count"])
          PY
